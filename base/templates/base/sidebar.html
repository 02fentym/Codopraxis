{# templates/base/sidebar.html #}
<style>
/* Always center icons inside their pill */
.icon-container,
#sidebar-toggle .icon-container {
  width: 2.5rem;      /* square pill */
  height: 2.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
}


/* Hide text labels in mini */
#app-shell:not(.sidebar-expanded) nav .menu > li > a .nav-label {
  display: none;
}

/* In mini mode, let the icon wrapper fill the pill and center its contents */
#app-shell:not(.sidebar-expanded) nav .menu > li > a .icon-container {
  width: 100%;           /* stop using the fixed 2.25rem box */
  flex: 1 1 auto;
  display: flex;
  align-items: center;
  justify-content: center;  /* <-- centers the SVG */
}



    #sidebar {
        width: 64px;
        transition: width .2s ease;
    }

    #app-shell.sidebar-expanded #sidebar {
        width: 280px;
    }

    .nav-label,
    .user-meta {
        opacity: 0;
        transform: translateX(-4px);
        max-width: 0;
        overflow: hidden;
        transition: opacity .15s ease, transform .15s ease, max-width .15s ease;
        white-space: nowrap;
    }

    #app-shell.sidebar-expanded .nav-label,
    #app-shell.sidebar-expanded .user-meta {
        opacity: 1;
        transform: translateX(0);
        max-width: 100%;
    }

    .icon-wrap {
        width: 2.25rem;
        flex-shrink: 0; /* Prevent icon from shrinking */
    }

    /* Ensure consistent alignment for all icon containers */
    .icon-container {
        display: flex;
        align-items: center;
        justify-content: flex-start; /* Align icons to the left */
        width: 2.25rem; /* Match icon-wrap width */
        flex-shrink: 0;
    }

    /* Adjust avatar to match icon alignment */
    .avatar-container {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        width: 2.25rem; /* Match icon-wrap width */
        flex-shrink: 0;
    }
</style>

<div class="flex h-full flex-col bg-base-200">
    <!-- Top bar with hamburger -->
    <div class="sticky top-0 z-10 bg-base-200 border-b border-base-300">
        <div class="h-12 flex items-center px-2">
            <button id="sidebar-toggle" class="btn btn-ghost btn-square tooltip flex items-center justify-start"
                data-tip="Toggle sidebar" aria-label="Toggle sidebar" aria-controls="sidebar" aria-expanded="false"
                type="button">
                <div class="icon-container">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </div>
            </button>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 overflow-y-auto p-2">
        <!-- Section label -->
        <div class="px-2 py-1 text-xs font-semibold uppercase opacity-70 nav-label">
            Navigation
        </div>

        <ul class="menu gap-1 mt-1">
            <li>
                <a href="{% url 'home' %}"
                    class="group flex items-center rounded-btn px-1 py-2 hover:bg-base-300/40 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary {% if request.resolver_match.url_name == 'home' %}bg-base-300/50{% endif %}">
                    <span class="icon-container">
                        <!-- Home icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 flex-shrink-0" viewBox="0 0 24 24"
                            fill="currentColor">
                            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8h5Z" />
                        </svg>
                    </span>
                    <span class="nav-label ml-3">Home</span>
                </a>
            </li>
        </ul>
    </nav>

    <!-- Bottom user info -->
    <div class="mt-auto border-t border-base-300 p-2">
        <div class="flex items-center rounded-btn px-2 py-2 hover:bg-base-300/40">
            <div class="avatar-container">
                <div class="w-8 h-8 rounded-full bg-neutral text-neutral-content grid place-items-center">
                    <span class="text-xs">
                        {{ user.get_full_name|default:user.username|default:""|slice:":1"|upper }}
                    </span>
                </div>
            </div>
            <div class="user-meta ml-3 leading-tight">
                <div class="font-medium">
                    {{ user.get_full_name|default:user.username }}
                </div>
                <div class="text-xs opacity-70">
                    {{ user.email }}
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    (() => {
        const app = document.getElementById('app-shell');
        const btn = document.getElementById('sidebar-toggle');
        if (!app || !btn) return;
        btn.addEventListener('click', () => {
            app.classList.toggle('sidebar-expanded');
            const expanded = app.classList.contains('sidebar-expanded');
            btn.setAttribute('aria-expanded', expanded ? 'true' : 'false');
        });
    })();
</script>
