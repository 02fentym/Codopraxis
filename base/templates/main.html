{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="codo-dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Codopraxis{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">

    <!-- highlight.js CSS (local) -->
    <link id="hljs-theme" rel="stylesheet" href="{% static 'vendor/highlightjs/styles/atom-one-light.min.css' %}">

    <!-- Toast UI Editor CSS (local) -->
    <link rel="stylesheet" href="{% static 'vendor/toastui/editor/toastui-editor.min.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/toastui/editor/toastui-editor-viewer.min.css' %}">

    <!-- Toast UI Editor JS (local, “all” bundle) -->
    <script src="{% static 'vendor/toastui/editor/toastui-editor-all.min.js' %}"></script>

    <!-- Code syntax highlight plugin (local) -->
    <script
        src="{% static 'vendor/toastui/plugin-code-syntax-highlight/toastui-editor-plugin-code-syntax-highlight.min.js' %}"></script>

</head>

<body class="min-h-screen">
    <!-- App shell starts mini; toggling `.sidebar-expanded` makes it 280px -->
    <div id="app-shell" class="flex min-h-screen bg-base-100">

        <!-- Sidebar -->
        <aside id="sidebar" class="bg-base-200 border-r border-base-300 sticky top-0 h-screen overflow-hidden">
            {% if user.is_authenticated %}
            {% include "base/sidebar.html" %}
            {% endif %}
        </aside>

        <!-- Main column -->
        <div class="flex-1 flex flex-col min-w-0">
            <!-- Page content -->
            <main id="page-content" class="p-6">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <!-- Mini↔Expanded behavior (width + label visibility) -->
<style>
    /* Existing styles remain unchanged */
    /* Sidebar widths */
    #sidebar {
        width: 56px;
        transition: width .22s ease;
    }

    #app-shell.sidebar-expanded #sidebar {
        width: 280px;
    }

    /* Labels hidden in mini, shown in expanded */
    #app-shell .nav-label {
        opacity: 0;
        width: 0;
        overflow: hidden;
        white-space: nowrap;
        transform: translateX(-4px);
        transition: opacity .18s ease, transform .18s ease;
    }

    #app-shell.sidebar-expanded .nav-label {
        opacity: 1;
        width: auto;
        transform: none;
    }

    /* Mini mode: center the icon, no row hover, no padding */
    #app-shell:not(.sidebar-expanded) .menu :where(li > *:not(ul)) {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 0;
        padding: 0;
    }

    #app-shell:not(.sidebar-expanded) .menu form button {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        padding: 0;
    }

    #app-shell:not(.sidebar-expanded) .icon-wrap {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 36px;
        height: 36px;
        border-radius: .5rem;
    }

    /* Icon wrapper */
    .icon-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 36px;
        width: 36px;
        border-radius: .5rem;
        transition: box-shadow .15s ease, background-color .15s ease;
    }

    #app-shell:not(.sidebar-expanded) .menu :where(li > *:not(ul)):hover {
        background-color: transparent;
    }

    /* Optional: show carets only when expanded */
    #app-shell .nav-caret {
        display: none;
    }

    #app-shell.sidebar-expanded .nav-caret {
        display: inline-flex;
    }

    /* Reset Tailwind defaults */
    .menu li, .menu a, .menu button {
        padding: 0;
        margin: 0;
    }

    /* Menu-title in mini mode */
    #app-shell:not(.sidebar-expanded) .menu-title {
        visibility: hidden;
        height: 28px;
        margin: 0;
        padding: 0;
    }

    /* Menu-title in expanded mode */
    #app-shell.sidebar-expanded .menu-title {
        height: 28px;
        margin: 0;
        padding: 0;
        line-height: 28px;
    }

    /* Ensure Account section menu has consistent spacing */
    #app-shell .menu.border-t {
        margin-top: 0;
        padding-top: 0;
    }

    /* User info div in Account section */
    #app-shell .menu .avatar-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 36px; /* Match icon-wrap height */
        margin: 0;
        padding: 0;
        gap: 0; /* No gap in mini mode */
    }

    #app-shell.sidebar-expanded .menu .avatar-container {
        justify-content: flex-start; /* Align left in expanded mode */
        gap: 0.5rem; /* Match menu item spacing */
    }

    /* Reset Tailwind avatar styles */
    #app-shell .menu .avatar {
        margin: 0;
        padding: 0;
    }

    /* Ensure avatar inside icon-wrap is centered */
    #app-shell:not(.sidebar-expanded) .menu .avatar-container .icon-wrap {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 36px;
        height: 36px;
    }
</style>


    <!-- Tiny JS toggle (desktop only) -->
    <script>
        (() => {
            const shell = document.getElementById('app-shell');
            const btn = document.getElementById('sidebar-toggle');

            const sync = () => {
                const expanded = shell.classList.contains('sidebar-expanded');
                btn.setAttribute('aria-expanded', expanded ? 'true' : 'false');
            };

            btn.addEventListener('click', () => {
                shell.classList.toggle('sidebar-expanded');
                sync();
            });

            sync(); // initialize ARIA
        })();
    </script>
</body>

</html>
