{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="codo-dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Codopraxis{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">

    <!-- highlight.js CSS (local) -->
    <link id="hljs-theme" rel="stylesheet" href="{% static 'vendor/highlightjs/styles/atom-one-light.min.css' %}">

    <!-- Toast UI Editor CSS (local) -->
    <link rel="stylesheet" href="{% static 'vendor/toastui/editor/toastui-editor.min.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/toastui/editor/toastui-editor-viewer.min.css' %}">

    <!-- Toast UI Editor JS (local, “all” bundle) -->
    <script src="{% static 'vendor/toastui/editor/toastui-editor-all.min.js' %}"></script>

    <!-- Code syntax highlight plugin (local) -->
    <script
        src="{% static 'vendor/toastui/plugin-code-syntax-highlight/toastui-editor-plugin-code-syntax-highlight.min.js' %}"></script>

</head>

<body class="min-h-screen">
    <!-- App shell starts mini; toggling `.sidebar-expanded` makes it 280px -->
    <div id="app-shell" class="flex min-h-screen bg-base-100">

        <!-- Sidebar -->
        <aside id="sidebar" class="bg-base-200 border-r border-base-300 sticky top-0 h-screen overflow-hidden">
            {% if user.is_authenticated %}
            {% include "base/sidebar.html" %}
            {% endif %}
        </aside>

        <!-- Main column -->
        <div class="flex-1 flex flex-col min-w-0">
            <!-- Page content -->
            <main id="page-content" class="p-6">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <!-- Mini↔Expanded behavior (width + label visibility) -->
    <style>
        /* Sidebar widths */
        #sidebar {
            width: 56px;
            transition: width .22s ease;
        }
    
        /* mini */
        #app-shell.sidebar-expanded #sidebar {
            width: 280px;
        }
    
        /* expanded */
    
        /* Labels hidden in mini, shown in expanded */
        #app-shell .nav-label {
            opacity: 0;
            width: 0;
            overflow: hidden;
            white-space: nowrap;
            transform: translateX(-4px);
            transition: opacity .18s ease, transform .18s ease;
        }
    
        #app-shell.sidebar-expanded .nav-label {
            opacity: 1;
            width: auto;
            transform: none;
        }
    
        /* Mini mode: center the icon, no row hover, tight padding */
        #app-shell:not(.sidebar-expanded) .menu :where(li > *:not(ul)) {
            justify-content: center;
            /* centers icon column */
            gap: 0;
            /* no gap since label is hidden */
            padding-left: .25rem;
            /* tighter hit area */
            padding-right: .25rem;
        }
    
        #app-shell:not(.sidebar-expanded) .menu :where(li > *:not(ul)):hover {
            background-color: transparent;
            /* kill the full-row hover */
        }
    
        /* Icon wrapper: this gets the hover ring instead of the row */
        #app-shell .icon-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 36px;
            /* comfy target */
            width: 36px;
            border-radius: .5rem;
            transition: box-shadow .15s ease, background-color .15s ease;
        }
    
        /* Optional: show carets only when expanded (if you add any) */
        #app-shell .nav-caret {
            display: none;
        }
    
        #app-shell.sidebar-expanded .nav-caret {
            display: inline-flex;
        }
    </style>


    <!-- Tiny JS toggle (desktop only) -->
    <script>
        (() => {
            const shell = document.getElementById('app-shell');
            const btn = document.getElementById('sidebar-toggle');

            const sync = () => {
                const expanded = shell.classList.contains('sidebar-expanded');
                btn.setAttribute('aria-expanded', expanded ? 'true' : 'false');
            };

            btn.addEventListener('click', () => {
                shell.classList.toggle('sidebar-expanded');
                sync();
            });

            sync(); // initialize ARIA
        })();
    </script>
</body>



</html>
